[project]
name = "ai-coloring-page-generator"
version = "0.9.3"
description = "Windows desktop tool that turns photos, prompts, and sketches into print-ready coloring book pages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "coloringforge-dev" }]
keywords = ["coloring-book", "line-art", "stable-diffusion", "desktop", "windows", "generator"]

dependencies = [
    "PySide6>=6.7.0",
    "torch>=2.4.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "PyYAML>=6.0.1",
    "loguru>=0.7.2",
    "reportlab>=4.2.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
cuda = ["torch>=2.4.0+cu124"]
dev = ["pytest>=8.3.0", "pytest-qt>=4.4.0", "ruff>=0.5.0", "mypy>=1.11.0"]

[project.scripts]
coloringforge = "coloringforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coloringforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true